name: "Pruebas automatizadas — RF-14 Prevención de colisiones"

on:
  push:
  pull_request:
    paths:
      - "src/lib/document-storage.ts"
      - "tests/rf14-local-file-collision.test.ts"
      - "docs/pruebas/RF-14.md"
      - ".github/workflows/pruebas-rf-14.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-rf-14:
    name: Verificación automatizada RF-14
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas RF-14
        run: npx tsx --test tests/rf14-local-file-collision.test.ts
      - name: Validar estilo de los archivos implicados
        run: npx eslint src/lib/document-storage.ts tests/rf14-local-file-collision.test.ts
      - name: Registrar resultado en el resumen
        if: always()
        run: |
          echo "### RF-14 — Prevención de colisiones de archivos" >> "$GITHUB_STEP_SUMMARY"
          echo "Categorías: unitaria, integración, funcional, rendimiento/estrés y aceptación automatizada." >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado del trabajo: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
